<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixiv RefreshToken Exporter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="panel">
    <header>
      <h1>Pixiv RefreshToken Exporter</h1>
      <p>点击登录后完成 Pixiv 官方登录，扩展会自动捕获 OAuth code 并只显示 refresh_token。</p>
    </header>

    <section class="controls">
      <button id="login-button" type="button">开始登录</button>
      <button id="clear-button" type="button" class="secondary">清理临时状态</button>
    </section>

    <section class="manual">
      <label for="manual-code">自动捕获失败时，可粘贴 callback URL、pixiv:// URL 或 code</label>
      <textarea id="manual-code" spellcheck="false" placeholder="https://app-api.pixiv.net/.../callback?code=... 或 pixiv://account/login?code=..."></textarea>
      <button id="manual-button" type="button" class="secondary">手动换取 token</button>
    </section>

    <section id="status" class="status" aria-live="polite"></section>

    <section id="token-section" class="token-section" hidden>
      <label for="token-output">refresh_token</label>
      <textarea id="token-output" readonly spellcheck="false"></textarea>
      <button id="copy-button" type="button">复制 refresh_token</button>
    </section>
  </main>
  <script src="index.js"></script>
</body>
</html>
