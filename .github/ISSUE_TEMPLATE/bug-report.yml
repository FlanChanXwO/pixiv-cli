name: Bug 报告 / Bug report
description: 报告可复现的问题。 / Report a reproducible problem.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        提交前请移除凭据、cookie、token、私有 URL 或任何敏感数据。
        Remove credentials, cookies, tokens, private URLs, and any sensitive data before submitting.

  - type: textarea
    id: summary
    attributes:
      label: 发生了什么？ / What happened?
      description: 实际发生了什么，你期望的结果是什么。 / What happened, and what you expected instead.
      placeholder: |
        运行某命令后退出码非 0，且没有可读输出。
        Expected: 返回结果或给出可读错误。
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 如何复现 / How to reproduce
      description: 最小可复现步骤，必要时用占位值。 / Smallest safe steps to reproduce. Use placeholders when needed.
      placeholder: |
        1. 运行 / Run: <command>
        2. 输入或配置 / Input or config: <redacted>
        3. 观察到 / Observed: ...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统 / OS
      description: 运行环境。 / Where you run it.
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux x86_64
        - Linux arm64
        - Windows x86_64
        - Windows arm64
        - Other / 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: "`pixiv --version` 输出。 / Output of `pixiv --version`."
      placeholder: pixiv 1.x.x
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或输出 / Redacted logs or output
      description: 可选。只粘贴排查所需的脱敏输出。 / Optional. Paste only what's needed to debug, redacted.
      render: shell
      placeholder: |
        $ pixiv --version
        pixiv 1.x.x
        $ pixiv ...
        (redacted output)
