name: 功能请求 / Feature request
description: 提出明确的改进建议。 / Propose a focused improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        先说明你想解决的问题。不要包含凭据、cookie、token、私有 URL 或敏感数据。
        Start with the problem. No credentials, cookies, tokens, private URLs, or sensitive data.

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to solve
      description: 促使你提出此请求的具体流程或限制。 / The concrete workflow or limitation that motivates this request.
      placeholder: |
        想批量处理某个范围，但目前只能一次一个。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望行为 / Proposed behavior
      description: 期望的行为，必要时附示例。 / Desired behavior. Examples welcome.
      placeholder: |
        <command> <args>
        期望完成 X / Expected: does X.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional context
      description: 可选。示例、受影响接口、兼容性顾虑或尝试过的替代方法。 / Optional. Examples, affected interfaces, compatibility concerns, workarounds tried.
