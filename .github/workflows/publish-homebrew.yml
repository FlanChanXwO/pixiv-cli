name: Publish Homebrew formula

# §16.2：Homebrew 是独立 publisher，与容器、ClawHub、SkillHub 并行；任一渠道
# 失败不阻塞其他渠道。GITHUB_TOKEN 创建的 Release 不会再触发 release 事件，
# 因此使用 workflow_run 作为受信任的异步 handoff。
on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  # §17：手动恢复只接受原始的 release_run_id，不接受 tag/latest 等模糊解析。
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Original trusted Release workflow run ID
        required: true
        type: string

permissions: {}

jobs:
  publish_homebrew:
    name: Publish Homebrew formula
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    # §23/§24：environment 承载 Homebrew 专属凭据，但不再要求额外的 reviewer
    # 审批；全链路只有 release-approval 一个人工审批边界。
    environment: release
    permissions:
      actions: read
      contents: read
    outputs:
      release_tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      run_id: ${{ steps.handoff.outputs.run_id }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve the trusted release run
        id: handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_id="$INPUT_RUN_ID"
          else
            run_id="$EVENT_RUN_ID"
          fi
          case "$run_id" in
            ''|*[!0-9]*) echo "release_run_id must be a positive decimal number: $run_id" >&2; exit 1 ;;
          esac
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
          test "$(printf '%s' "$run" | jq -r '.name')" = 'Release'
          test "$(printf '%s' "$run" | jq -r '.conclusion')" = success
          test "$(printf '%s' "$run" | jq -r '.repository.full_name')" = "$GITHUB_REPOSITORY"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$(printf '%s' "$run" | jq -r '.head_sha')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.handoff.outputs.head_sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Download the prepared handoff and release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: prepared-release-checksums
          path: prepared
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.handoff.outputs.run_id }}

      - name: Download the published release checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-release-checksums
          path: published-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.handoff.outputs.run_id }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: verified-release-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.handoff.outputs.run_id }}

      # §15/§19：只校验 production section（Homebrew 不发布容器镜像），并重新
      # 计算每个归档的 checksum，确保渲染 formula 用的是同一批 bytes。
      - name: Verify the immutable handoff and release archives
        id: verify
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.handoff.outputs.run_id }}
          RUN_HEAD_SHA: ${{ steps.handoff.outputs.head_sha }}
        run: |
          set -euo pipefail
          go run ./tools/release verify-handoff-set \
            --handoff prepared/release/release-handoff.json \
            --section production \
            --dist-dir release-assets \
            --container-dir containers \
            --checksums prepared/dist/checksums.txt \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --run-head-sha "$RUN_HEAD_SHA"

      - name: Resolve Homebrew verification platforms
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          raw=$(go run ./tools/platformmatrix --capability homebrew)
          printf 'matrix=%s\n' "$(printf '%s' "$raw" | jq -c '.include |= map(. + {display: (.goos + "/" + .goarch)})')" >> "$GITHUB_OUTPUT"

      - name: Render exactly one channel formula from the published checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -eu
          case "$(go run ./scripts/cmd/releaseassets channel --version "$VERSION")" in
            stable)
              formula_name=pixiv-cli
              ;;
            prerelease)
              formula_name=pixiv-cli-beta
              ;;
            *)
              printf '%s\n' 'unexpected release classification' >&2
              exit 1
              ;;
          esac
          mkdir -p staging-formula
          go run ./scripts/cmd/homebrewformula render \
            --formula "$formula_name" \
            --version "$VERSION" \
            --checksums published-release/checksums.txt \
            --output "staging-formula/$formula_name.rb"
          printf '%s\n' "$formula_name" > staging-formula/formula-name

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staging-homebrew-formula
          path: staging-formula
          if-no-files-found: error
          retention-days: 1

  verify_homebrew_formula:
    name: Verify Homebrew · ${{ matrix.display }}
    needs: publish_homebrew
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.publish_homebrew.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: staging-homebrew-formula
          path: staging-formula
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: verified-release-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.publish_homebrew.outputs.run_id }}
      - name: Install the staging formula against the exact production archive
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.publish_homebrew.outputs.release_tag }}
        run: |
          set -euo pipefail
          formula_name=$(cat staging-formula/formula-name)
          case "$formula_name" in
            pixiv-cli|pixiv-cli-beta) ;;
            *) exit 1 ;;
          esac
          test "$(find staging-formula -maxdepth 1 -type f -print | LC_ALL=C sort)" = "$(printf '%s\n%s\n' staging-formula/formula-name "staging-formula/$formula_name.rb" | LC_ALL=C sort)"
          version="${RELEASE_TAG#v}"
          archive="pixiv-cli_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          test -f "release-assets/$archive"
          public_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$archive"
          if [ '${{ matrix.goos }}' = linux ]; then
            verify_url="file:///release-assets/$archive"
          else
            verify_url="file://$(pwd)/release-assets/$archive"
          fi
          python3 - "$public_url" "$verify_url" "staging-formula/$formula_name.rb" "staging-formula/$formula_name-verify.rb" <<'PY'
          import pathlib
          import sys
          old, new, source, target = sys.argv[1:]
          body = pathlib.Path(source).read_text(encoding="utf-8")
          if body.count(old) != 1:
              raise SystemExit("expected exactly one production archive URL in formula")
          pathlib.Path(target).write_text(body.replace(old, new), encoding="utf-8")
          PY
          if [ '${{ matrix.goos }}' = linux ]; then
            staging_dir="$(pwd)/staging-formula"
            assets_dir="$(pwd)/release-assets"
            case "$staging_dir" in /*) ;; *) exit 1 ;; esac
            docker run --rm \
              --mount "type=bind,src=$staging_dir,dst=/staging-formula,readonly" \
              --mount "type=bind,src=$assets_dir,dst=/release-assets,readonly" \
              --env RELEASE_TAG \
              --env HOMEBREW_NO_AUTO_UPDATE=1 \
              --env HOMEBREW_NO_ENV_HINTS=1 \
              --entrypoint bash \
              homebrew/brew@sha256:b0072bfdebf5934ae24b93b44a1928a88057399b3283ffa0177bb86084fdedfd \
              -euo pipefail -c '
                formula_name=$(cat /staging-formula/formula-name)
                case "$formula_name" in
                  pixiv-cli|pixiv-cli-beta) ;;
                  *) exit 1 ;;
                esac
                staging_tap=pixiv-cli-release/staging
                tap_dir="$(brew --repository)/Library/Taps/pixiv-cli-release/homebrew-staging"
                brew tap-new "$staging_tap" --no-git
                cp "/staging-formula/$formula_name-verify.rb" "$tap_dir/Formula/$formula_name.rb"
                brew install --formula "$staging_tap/$formula_name"
                test "$(pixiv --version)" = "pixiv $RELEASE_TAG"
              '
          else
            staging_tap=pixiv-cli-release/staging
            tap_dir="$(brew --repository)/Library/Taps/pixiv-cli-release/homebrew-staging"
            brew tap-new "$staging_tap" --no-git
            brew trust --tap "$staging_tap"
            cp "staging-formula/$formula_name-verify.rb" "$tap_dir/Formula/$formula_name.rb"
            brew install --formula "$staging_tap/$formula_name"
            test "$(pixiv --version)" = "pixiv $RELEASE_TAG"
          fi

  deploy_homebrew_tap:
    name: Deploy the verified Homebrew formula
    needs: [publish_homebrew, verify_homebrew_formula]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      # 单调 deploy 的判定逻辑属于 trusted policy，必须来自受保护的默认分支 tip，
      # 而不是 release tag 自身携带的提交。否则恢复一个旧 release_run_id 时，
      # 判定代码会随 tag 一起回退（旧版本根本没有修复后的状态机）。
      # workflow_dispatch / workflow_run 下 github.sha 都是默认分支 tip。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: staging-homebrew-formula
          path: staging-formula
      - name: Decide whether the tap may accept this formula
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          formula_name=$(cat staging-formula/formula-name)
          case "$formula_name" in
            pixiv-cli|pixiv-cli-beta) ;;
            *) exit 1 ;;
          esac
          test -f "staging-formula/$formula_name.rb"
          test "$(find staging-formula -maxdepth 1 -type f -print | LC_ALL=C sort)" = "$(printf '%s\n%s\n' staging-formula/formula-name "staging-formula/$formula_name.rb" | LC_ALL=C sort)"
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          rm -rf "$tap_dir"
          git clone https://github.com/FlanChanXwO/homebrew-tap.git "$tap_dir"
          mkdir -p "$tap_dir/Formula"
          # §17/§21：单调 deploy。同版本且字节一致 → no-op；请求版本更旧，或同版本
          # 但内容不同 → 在拿到 deploy key 之前 fail closed，绝不回退已发布 Formula。
          go run ./scripts/cmd/homebrewrecovery \
            --current "$tap_dir/Formula/$formula_name.rb" \
            --requested "staging-formula/$formula_name.rb" \
            --github-output "$GITHUB_OUTPUT"
      - name: Prepare an exact one-formula tap commit over public HTTPS
        if: ${{ steps.deploy.outputs.action == 'install' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.publish_homebrew.outputs.release_tag }}
        run: |
          set -euo pipefail
          formula_name=$(cat staging-formula/formula-name)
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          git -C "$tap_dir" config user.name github-actions[bot]
          git -C "$tap_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp "staging-formula/$formula_name.rb" "$tap_dir/Formula/$formula_name.rb"
          git -C "$tap_dir" add -- "Formula/$formula_name.rb"
          test "$(git -C "$tap_dir" diff --cached --name-only)" = "Formula/$formula_name.rb"
          test -z "$(git -C "$tap_dir" status --porcelain | sed -n '\|^?? |p')"
          git -C "$tap_dir" commit -m "${RELEASE_TAG}: update $formula_name formula"
      - name: Push the verified formula with the protected deploy key
        if: ${{ steps.deploy.outputs.action == 'install' }}
        shell: bash
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -eu
          umask 077
          key_path="$RUNNER_TEMP/homebrew-tap-deploy-key"
          trap 'rm -f "$key_path"' EXIT HUP INT TERM
          test -n "$HOMEBREW_TAP_DEPLOY_KEY"
          # OpenSSH 私钥必须以换行结尾；secret 是否保留末尾 LF 不应影响部署。
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$key_path"
          chmod 600 "$key_path"
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          git -C "$tap_dir" remote set-url origin git@github.com:FlanChanXwO/homebrew-tap.git
          GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/templates/homebrew/github.com-known-hosts" \
            git -C "$tap_dir" push origin HEAD:main
