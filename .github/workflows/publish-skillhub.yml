name: Publish SkillHub skill

on:
  # Release is created with github.token, which intentionally cannot trigger a
  # second `release` workflow. workflow_run is the safe handoff after all
  # release and Homebrew gates finish. Its head branch is main for a recovered
  # release, so the exact tag comes from Release's verified handoff artifact.
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      # §17：手动恢复只接受原始的 release_run_id。
      release_run_id:
        description: Original trusted Release workflow run ID
        required: true
        type: string

env:
  SKILLHUB_HOST: https://api.skillhub.cn

permissions: {}

jobs:
  publish:
    name: Publish pixiv-cli to SkillHub
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Resolve the trusted release run
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_id="$INPUT_RUN_ID"
          else
            run_id="$EVENT_RUN_ID"
          fi
          case "$run_id" in
            ''|*[!0-9]*) echo "release_run_id must be a positive decimal number: $run_id" >&2; exit 1 ;;
          esac
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
          test "$(printf '%s' "$run" | jq -r '.name')" = 'Release'
          test "$(printf '%s' "$run" | jq -r '.conclusion')" = success
          test "$(printf '%s' "$run" | jq -r '.repository.full_name')" = "$GITHUB_REPOSITORY"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$(printf '%s' "$run" | jq -r '.head_sha')" >> "$GITHUB_OUTPUT"

      - name: Download the prepared handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepared-release-checksums
          path: prepared
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.run.outputs.run_id }}
      - name: Resolve and verify the immutable release tag
        id: release_tag
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          RUN_HEAD_SHA: ${{ steps.run.outputs.head_sha }}
        run: |
          set -euo pipefail
          # §15：只发布 skill 的 publisher 不下载归档/镜像，用 identity-only 模式
          # 证明这份 handoff 确实来自刚解析出的那个 run。
          go run ./tools/release verify-handoff-identity \
            --handoff prepared/release-handoff.json \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --run-head-sha "$RUN_HEAD_SHA"
          release_tag=$(jq -r '.tag' prepared/release-handoff.json)
          test -n "$release_tag"
          printf 'value=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.run.outputs.head_sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Verify the published release tag belongs to the default branch
        id: skill_change
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          go run ./tools/release verify-source --tag "$RELEASE_TAG" --default-branch "$DEFAULT_BRANCH" --github-output "$GITHUB_OUTPUT"
          go run ./tools/release verify-published-release --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            go run ./tools/release verify-handoff --repository "$GITHUB_REPOSITORY" --run-id "$WORKFLOW_RUN_ID"
          fi
          previous_tag=
          while IFS= read -r tag; do
            if [ "$tag" != "$RELEASE_TAG" ] && go run ./scripts/cmd/releaseassets validate --version "${tag#v}" >/dev/null 2>&1; then
              previous_tag=$tag
              break
            fi
          done <<EOF
          $(git tag --merged "$RELEASE_TAG" --list 'v[0-9]*' --sort=-v:refname)
          EOF
          if [ -z "$previous_tag" ]; then
            printf '%s\n' 'publish=true' >> "$GITHUB_OUTPUT"
          else
            set +e
            git diff --quiet "$previous_tag" "$RELEASE_TAG" -- skills/pixiv-cli
            diff_status=$?
            set -e
            case "$diff_status" in
              0)
                printf '%s\n' 'publish=false' >> "$GITHUB_OUTPUT"
                printf 'Skill unchanged since %s; skipping SkillHub publication.\n' "$previous_tag"
                ;;
              1)
                printf '%s\n' 'publish=true' >> "$GITHUB_OUTPUT"
                ;;
              *)
                printf 'cannot compare Skill changes from %s to %s\n' "$previous_tag" "$RELEASE_TAG" >&2
                exit "$diff_status"
                ;;
            esac
          fi
      # The vendor installer runs before this workflow makes SKILLHUB_TOKEN available.
      # Its CLI is only used after the immutable tag and local metadata have passed.
      - name: Install the official SkillHub CLI without credentials
        if: steps.skill_change.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/skillhub-install.sh"
          curl --fail --location --silent --show-error https://skillhub.cn/install/install.sh --output "$installer"
          bash "$installer" --cli-only
          "$HOME/.local/bin/skillhub" --skip-self-upgrade --version
      - name: Dry-run the exact tagged product skill
        if: steps.skill_change.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.local/bin/skillhub" --skip-self-upgrade publish skills/pixiv-cli \
            --host "$SKILLHUB_HOST" \
            --dry-run \
            --json
      - name: Publish and confirm the SkillHub submission
        if: steps.skill_change.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SKILLHUB_TOKEN"
          response="$RUNNER_TEMP/skillhub-publish.json"
          "$HOME/.local/bin/skillhub" --skip-self-upgrade publish skills/pixiv-cli \
            --host "$SKILLHUB_HOST" \
            --changelog "Synchronized with Pixiv CLI $RELEASE_TAG" \
            --json | tee "$response"
          python3 - "$response" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              result = json.load(source)

          skill_id = result.get("skillId")
          review_status = result.get("reviewStatus") or result.get("status")
          if result.get("ok") is not True or not skill_id or not review_status:
              raise SystemExit("SkillHub accepted the request without skillId or review status")

          print(f"SkillHub submission confirmed: skillId={skill_id} reviewStatus={review_status}")
          public_url = result.get("publicUrl")
          if public_url:
              print(f"SkillHub URL: {public_url}")
          PY
