name: Quality gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 仅允许明确的文档目录走轻量门禁；任何无法归类的变更都由 changescope 选择完整验证。
  classify_changes:
    name: Classify change scope
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      quality_required: ${{ steps.scope.outputs.quality_required }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - name: Detect documentation-only changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            {
              printf '%s\n' 'docs_only=false'
              printf '%s\n' 'quality_required=true'
              printf '%s\n' 'platform_required=true'
              printf '%s\n' 'container_required=true'
              printf '%s\n' 'native_required=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          go run ./scripts/cmd/changescope --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  quality:
    needs: classify_changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - name: Test documentation contracts
        if: ${{ needs.classify_changes.outputs.docs_only == 'true' }}
        shell: bash
        run: go test ./scripts/tests/documentation -count=1
      - name: Test Go sources
        if: ${{ needs.classify_changes.outputs.docs_only != 'true' }}
        shell: bash
        run: go test ./... -count=1
      - name: Test Go sources with the race detector
        if: ${{ needs.classify_changes.outputs.docs_only != 'true' }}
        shell: bash
        run: go test -race ./... -count=1
      - name: Vet Go sources
        if: ${{ needs.classify_changes.outputs.docs_only != 'true' }}
        shell: bash
        run: go vet ./...
      - name: Build the local binary
        if: ${{ needs.classify_changes.outputs.docs_only != 'true' }}
        shell: bash
        run: sh scripts/build.sh
      - name: Test release behavior contracts
        if: ${{ needs.classify_changes.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          sh scripts/test-package-release.sh
          go test ./scripts/tests/clawhubworkflow -count=1
          go test ./scripts/tests/containerrelease -count=1
          go test ./tools/release ./tools/platformmatrix -count=1
      - name: Install pinned pre-commit
        if: ${{ needs.classify_changes.outputs.docs_only != 'true' }}
        shell: bash
        run: python -m pip install --disable-pip-version-check pre-commit==4.6.0
      - name: Run pre-commit checks
        if: ${{ needs.classify_changes.outputs.docs_only != 'true' }}
        shell: bash
        run: python -m pre_commit run --all-files

  windows_login_handler:
    name: Windows login handler contracts
    needs: classify_changes
    if: ${{ needs.classify_changes.outputs.docs_only != 'true' }}
    runs-on: windows-2025
    env:
      # Rust ugoira staticlib 使用 MSVC ABI；MinGW 默认链接器无法解析其运行时符号。
      CC: clang -fuse-ld=lld
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
      - name: Test native login handler contracts
        shell: bash
        run: |
          # Quality gate 已运行完整 internal/cli；Windows job 聚焦 root callback
          # wiring，并由 loginhelper 包承担真实 Windows registry contract。
          go test ./internal/cli -run '^(TestAuthURLCallback|TestAuthURLHandlerInstall|TestNormalCLIInvocationEnsuresPersistentHandlerWithoutBlockingCommand)$' -count=1
          go test ./internal/cli/commands/pixiv/auth/loginhelper -count=1

  quality_gate:
    name: Quality gate
    needs: [classify_changes, quality, windows_login_handler]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require expected quality outcome
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify_changes.result }}
          DOCS_ONLY: ${{ needs.classify_changes.outputs.docs_only }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          WINDOWS_RESULT: ${{ needs.windows_login_handler.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = success
          test "$QUALITY_RESULT" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$WINDOWS_RESULT" = skipped
          else
            test "$WINDOWS_RESULT" = success
          fi
