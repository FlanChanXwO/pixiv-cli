name: Quality gate

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch: {}

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  quality_gate:
    name: Quality gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Detect documentation-only changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            {
              printf '%s\n' 'docs_only=false'
              printf '%s\n' 'quality_required=true'
              printf '%s\n' 'platform_required=true'
              printf '%s\n' 'container_required=true'
              printf '%s\n' 'native_required=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash ./scripts/classify-change-scope.sh --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Test documentation contracts
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        shell: bash
        run: go test ./scripts/tests/documentation -count=1
      - name: Test Go sources
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: go test ./... -count=1
      - name: Test Go sources with the race detector
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: go test -race ./... -count=1
      - name: Vet Go sources
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: go vet ./...
      - name: Build the local binary
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: sh scripts/build.sh
      - name: Test release packaging
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: sh scripts/test-package-release.sh
      - name: Check Go formatting
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          test -z "$unformatted" || {
            printf '%s\n' "$unformatted"
            exit 1
          }
      - name: Explain quality failure contract
        if: ${{ failure() }}
        shell: bash
        run: echo '::error::Required quality checks did not complete successfully.'
