name: Homebrew prepublish verification and recovery

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public stable Release tag to verify or recover
        required: true
        type: string
      # 该 workflow 只做发布前验证与恢复核验，不再拥有 deploy 分支：Homebrew 的
      # 唯一发布入口是 publish-homebrew.yml（消费 immutable handoff）。保留第二个
      # 写 tap 的路径会让发布绕过 handoff/checksum 校验（§18/§25.3）。

# 手动恢复只从执行所在的默认分支读取受审 workflow；输入 tag 仅绑定已公开的 Release
# 资产。该 workflow 验证安装链是否可用，但不写入 tap。
env:
  RELEASE_TAG: ${{ inputs.release_tag }}

permissions:
  contents: read

jobs:
  validate_existing_release:
    name: Validate an existing public stable Release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Validate the manual tag and the public Release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          go run ./tools/release verify-source --tag "$RELEASE_TAG" --default-branch "$DEFAULT_BRANCH"
          go run ./tools/release verify-published-release --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --stable

  render_stable_formula:
    name: Render a stable formula from Release checksums
    needs: validate_existing_release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Download only the public Release checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified-release
          gh release download "$RELEASE_TAG" --pattern checksums.txt --dir verified-release
          test "$(find verified-release -maxdepth 1 -type f -print | LC_ALL=C sort)" = "verified-release/checksums.txt"
      - name: Render exactly the stable formula
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$(go run ./scripts/cmd/releaseassets channel --version "$version")" = stable
          mkdir -p staging-formula
          go run ./scripts/cmd/homebrewformula render \
            --formula pixiv-cli \
            --version "$version" \
            --checksums verified-release/checksums.txt \
            --output staging-formula/pixiv-cli.rb
          printf '%s\n' pixiv-cli > staging-formula/formula-name
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-homebrew-formula
          path: staging-formula
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-checksums
          path: verified-release/checksums.txt
          if-no-files-found: error
          retention-days: 1

  verify_homebrew_formula:
    name: Verify Homebrew on ${{ matrix.os }}/${{ matrix.arch }}
    needs: render_stable_formula
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: ubuntu-22.04
            os: linux
            arch: amd64
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staging-homebrew-formula
          path: staging-formula
      - name: Install the local staging formula and verify its version
        shell: bash
        run: |
          set -euo pipefail
          formula_name=$(cat staging-formula/formula-name)
          test "$formula_name" = pixiv-cli
          test "$(find staging-formula -maxdepth 1 -type f -print | LC_ALL=C sort)" = "$(printf '%s\n%s\n' staging-formula/formula-name staging-formula/pixiv-cli.rb | LC_ALL=C sort)"
          if [ '${{ matrix.os }}' = linux ]; then
            staging_dir="$(pwd)/staging-formula"
            case "$staging_dir" in /*) ;; *) exit 1 ;; esac
            docker run --rm \
              --mount "type=bind,src=$staging_dir,dst=/staging-formula,readonly" \
              --env RELEASE_TAG \
              --env HOMEBREW_NO_AUTO_UPDATE=1 \
              --env HOMEBREW_NO_ENV_HINTS=1 \
              --entrypoint bash \
              homebrew/brew@sha256:b0072bfdebf5934ae24b93b44a1928a88057399b3283ffa0177bb86084fdedfd \
              -euo pipefail -c '
                formula_name=$(cat /staging-formula/formula-name)
                test "$formula_name" = pixiv-cli
                test "$(find /staging-formula -maxdepth 1 -type f -print | LC_ALL=C sort)" = "$(printf "%s\\n%s\\n" /staging-formula/formula-name /staging-formula/pixiv-cli.rb | LC_ALL=C sort)"
                staging_tap=pixiv-cli-release/staging
                tap_dir="$(brew --repository)/Library/Taps/pixiv-cli-release/homebrew-staging"
                brew tap-new "$staging_tap" --no-git
                cp /staging-formula/pixiv-cli.rb "$tap_dir/Formula/pixiv-cli.rb"
                brew install --formula "$staging_tap/$formula_name"
                test "$(pixiv --version)" = "pixiv $RELEASE_TAG"
              '
          else
            staging_tap=pixiv-cli-release/staging
            tap_dir="$(brew --repository)/Library/Taps/pixiv-cli-release/homebrew-staging"
            brew tap-new "$staging_tap" --no-git
            brew trust --tap "$staging_tap"
            cp staging-formula/pixiv-cli.rb "$tap_dir/Formula/pixiv-cli.rb"
            brew install --formula "$staging_tap/$formula_name"
            test "$(pixiv --version)" = "pixiv $RELEASE_TAG"
          fi
