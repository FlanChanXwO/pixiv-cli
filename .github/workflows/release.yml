name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable SemVer tag to recover
        required: true
        type: string

# push 与手工恢复只允许在这里选择发布 tag；其余版本、checkout、Release 与 Formula
# 全部绑定此值，禁止 workflow_dispatch 的 main ref 混入生产产物。
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

# 令每个 job 显式声明自己所需的最小 token 权限。
permissions: {}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      - name: Verify the exact immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) printf '%s\n' 'release tag must start with v and a digit' >&2; exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          fi
          go run ./scripts/releaseassets validate --version "${RELEASE_TAG#v}"
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"
          set +e
          response=$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)
          api_status=$?
          set -e
          if [ "$api_status" -eq 0 ]; then
            printf '%s\n' 'a Release already exists for the requested tag' >&2
            exit 1
          fi
          printf '%s\n' "$response" | grep -Eq 'HTTP/[0-9.]+ 404|HTTP 404'
      - name: Statically check release workflow policy
        shell: bash
        run: sh scripts/test-release-workflow.sh

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CC: ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            rust_target: x86_64-apple-darwin
            artifact: darwin-amd64
            cc: clang
          - runner: macos-15
            goos: darwin
            goarch: arm64
            rust_target: aarch64-apple-darwin
            artifact: darwin-arm64
            cc: clang
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
            artifact: linux-amd64
            cc: gcc
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
            cc: gcc
          - runner: windows-2025
            goos: windows
            goarch: amd64
            rust_target: x86_64-pc-windows-msvc
            artifact: windows-amd64
            cc: clang -fuse-ld=lld
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            rust_target: aarch64-pc-windows-msvc
            artifact: windows-arm64
            cc: clang -fuse-ld=lld
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      # 恢复 run 的 workflow 定义来自默认分支，但版本、CHANGELOG 与 Release notes 必须来自不可变 tag。
      - name: Validate the exact immutable release source
        shell: bash
        run: go run ./scripts/releaseassets validate --version "${RELEASE_TAG#v}"
      - name: Install the native Rust target
        shell: bash
        run: rustup target add '${{ matrix.rust_target }}'
      - name: Check vendored Rust sources
        shell: bash
        run: sh scripts/test-rust-vendor.sh
      - name: Check Rust formatting from vendored sources
        shell: bash
        working-directory: internal/download/ugoira_rs
        run: cargo fmt --check
      - name: Lint vendored Rust sources
        shell: bash
        working-directory: internal/download/ugoira_rs
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Apply the audited test-only recovery overlay
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test -z "$(git diff --cached --name-only)"
          git archive --format=tar "$GITHUB_SHA" -- \
            internal/cli/account_test.go \
            internal/cli/config_test.go \
            internal/download/ugoira_rust_test.go \
            internal/storage/auth/account_test.go \
            internal/update/installer_test.go \
            internal/update/releases_reader_nonwindows_test.go \
            internal/update/releases_reader_windows_test.go \
            internal/update/releases_test.go \
            internal/update/source_test.go \
            internal/utils/files/files_test.go \
            scripts/licensebundle/main_test.go \
            scripts/releaseworkflow/main.go \
            scripts/releaseworkflow/main_test.go \
            test/e2e/pixiv_binary_test.go | tar -xf -
          test "$(git diff --name-only)" = "$(printf '%s\n' \
            internal/cli/account_test.go \
            internal/cli/config_test.go \
            internal/download/ugoira_rust_test.go \
            internal/storage/auth/account_test.go \
            internal/update/installer_test.go \
            internal/update/releases_reader_nonwindows_test.go \
            internal/update/releases_reader_windows_test.go \
            internal/update/releases_test.go \
            internal/update/source_test.go \
            internal/utils/files/files_test.go \
            scripts/licensebundle/main_test.go \
            scripts/releaseworkflow/main.go \
            scripts/releaseworkflow/main_test.go \
            test/e2e/pixiv_binary_test.go)"
          test -z "$(git diff --cached --name-only)"
      - name: Test Go sources
        shell: bash
        run: go test ./...
      - name: Test Go sources with the race detector
        shell: bash
        run: go test -race ./...
      - name: Vet Go sources
        shell: bash
        run: go vet ./...
      - name: Audit bundled licenses
        shell: bash
        run: go run ./scripts/licensebundle --check
      - name: Test release packages
        shell: bash
        run: sh scripts/test-package-release.sh
      - name: Install the pinned pre-commit version
        shell: bash
        run: python -m pip install --disable-pip-version-check pre-commit==4.6.0
      - name: Run pre-commit checks
        shell: bash
        run: python -m pre_commit run --all-files

  # recovery overlay 仅存在于 build test gate。生产资产必须在新的 runner 上从不可变 tag 重建，
  # 使测试进程对 GITHUB_ENV、PATH 或 runner 临时目录的副作用无法跨 job 影响 Release。
  build_production:
    name: Build production ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CC: ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            rust_target: x86_64-apple-darwin
            artifact: darwin-amd64
            cc: clang
          - runner: macos-15
            goos: darwin
            goarch: arm64
            rust_target: aarch64-apple-darwin
            artifact: darwin-arm64
            cc: clang
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
            artifact: linux-amd64
            cc: gcc
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
            cc: gcc
          - runner: windows-2025
            goos: windows
            goarch: amd64
            rust_target: x86_64-pc-windows-msvc
            artifact: windows-amd64
            cc: clang -fuse-ld=lld
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            rust_target: aarch64-pc-windows-msvc
            artifact: windows-arm64
            cc: clang -fuse-ld=lld
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
          cache: false
      - name: Validate the exact immutable production source
        shell: bash
        run: go run ./scripts/releaseassets validate --version "${RELEASE_TAG#v}"
      - name: Install the native Rust target
        shell: bash
        run: rustup target add '${{ matrix.rust_target }}'
      - name: Rebuild the selected static library from the immutable tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git clean -ndx)"
          bash scripts/build-staticlibs.sh --target '${{ matrix.rust_target }}'
          git restore --source="$RELEASE_TAG^{commit}" -- internal/download/ugoira_rs/staticlib/manifest.json
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git clean -ndx)"
      - name: Check the generated diff
        shell: bash
        run: git diff --check
      - name: Build the versioned native executable
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          output='dist/pixiv'
          if [ '${{ matrix.goos }}' = windows ]; then
            output='dist/pixiv.exe'
          fi
          go build -trimpath -buildvcs=false \
            -ldflags "-X github.com/FlanChanXwO/pixiv-cli/internal/buildinfo.Version=${RELEASE_TAG} -X github.com/FlanChanXwO/pixiv-cli/internal/buildinfo.Commit=$(git rev-parse HEAD) -X github.com/FlanChanXwO/pixiv-cli/internal/buildinfo.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$output" ./cmd/pixiv
      - name: Package the fixed-name platform asset
        shell: bash
        run: |
          go run ./scripts/releaseassets package \
            --repo-root . \
            --version "${RELEASE_TAG#v}" \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --binary "dist/pixiv${{ matrix.goos == 'windows' && '.exe' || '' }}" \
            --output-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-${{ matrix.artifact }}
          path: dist/pixiv-cli_*
          if-no-files-found: error
          retention-days: 1

  # 在不声明 environment 的 job 中验证 tag 所指提交属于默认分支，避免 protected
  # release Environment 的 secret 在 ancestry shell gate 之前进入同一 job 生命周期。
  verify_release_source:
    name: Verify release source trust
    needs: build_production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Require the tag commit on the default release branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"

  publish:
    name: Sign and publish the GitHub Release
    needs: verify_release_source
    runs-on: ubuntu-24.04
    # Task 20 must create this protected Environment and store the signing values
    # as its secrets, rather than repository secrets available to arbitrary tags.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-darwin-amd64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-darwin-arm64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-linux-amd64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-linux-arm64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-windows-amd64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-windows-arm64
          path: dist
      - name: Create the signed release metadata
        shell: bash
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_SIGNING_KEY_ID: ${{ secrets.RELEASE_SIGNING_KEY_ID }}
        run: |
          set -eu
          umask 077
          key_path="$RUNNER_TEMP/pixiv-release-ed25519.pem"
          trap 'rm -f "$key_path"' EXIT HUP INT TERM
          test -n "$RELEASE_SIGNING_PRIVATE_KEY"
          test -n "$RELEASE_SIGNING_KEY_ID"
          printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY" > "$key_path"
          go run ./scripts/releaseassets finalize \
            --version "${RELEASE_TAG#v}" \
            --input-dir dist \
            --output-dir release \
            --key-id "$RELEASE_SIGNING_KEY_ID" \
            --private-key "$key_path" \
            --changelog CHANGELOG.md
      - name: Publish only the verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          prerelease=()
          case "$(go run ./scripts/releaseassets channel --version "${RELEASE_TAG#v}")" in
            stable)
              ;;
            prerelease)
              prerelease+=(--prerelease)
              ;;
            *)
              printf '%s\n' 'unexpected release classification' >&2
              exit 1
              ;;
          esac
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release/release-notes.md \
            "${prerelease[@]}" \
            release/pixiv-cli_*.tar.gz \
            release/pixiv-cli_*.zip \
            release/checksums.txt \
            release/checksums.json
          expected=$(find release -maxdepth 1 -type f ! -name release-notes.md -exec basename {} \; | LC_ALL=C sort)
          actual=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            printf '%s\n' 'draft release assets differ from the verified local set' >&2
            printf '%s\n' "expected:$expected" >&2
            printf '%s\n' "actual:$actual" >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false
      # 该 artifact 与已发布 Release 使用同一个本地 checksums.txt；下游不得重新下载或重算。
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-checksums
          path: release/checksums.txt
          if-no-files-found: error
          retention-days: 1

  render_homebrew_formula:
    name: Render the channel Homebrew formula
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-checksums
          path: verified-release
      - name: Render exactly one channel formula from the published checksums
        shell: bash
        run: |
          set -eu
          version="${RELEASE_TAG#v}"
          case "$(go run ./scripts/releaseassets channel --version "$version")" in
            stable)
              formula_name=pixiv-cli
              ;;
            prerelease)
              formula_name=pixiv-cli-beta
              ;;
            *)
              printf '%s\n' 'unexpected release classification' >&2
              exit 1
              ;;
          esac
          mkdir -p staging-formula
          go run ./scripts/homebrewformula render \
            --formula "$formula_name" \
            --version "$version" \
            --checksums verified-release/checksums.txt \
            --output "staging-formula/$formula_name.rb"
          printf '%s\n' "$formula_name" > staging-formula/formula-name
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-homebrew-formula
          path: staging-formula
          if-no-files-found: error
          retention-days: 1

  verify_homebrew_formula:
    name: Verify Homebrew on ${{ matrix.os }}/${{ matrix.arch }}
    needs: render_homebrew_formula
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staging-homebrew-formula
          path: staging-formula
      - name: Install the staging formula and verify its embedded version
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.os }}' = linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          formula_name=$(cat staging-formula/formula-name)
          case "$formula_name" in
            pixiv-cli|pixiv-cli-beta) ;;
            *) exit 1 ;;
          esac
          test "$(find staging-formula -maxdepth 1 -type f -print | LC_ALL=C sort)" = "$(printf '%s\n%s\n' staging-formula/formula-name "staging-formula/$formula_name.rb" | LC_ALL=C sort)"
          staging_tap=pixiv-cli-release/staging
          tap_dir="$(brew --repository)/Library/Taps/pixiv-cli-release/homebrew-staging"
          brew tap-new "$staging_tap" --no-git
          brew trust --tap "$staging_tap"
          cp "staging-formula/$formula_name.rb" "$tap_dir/Formula/$formula_name.rb"
          brew install --formula "$staging_tap/$formula_name"
          pixiv version --json | python3 -c 'import json, sys; actual = json.load(sys.stdin)["version"]; expected = sys.argv[1]; assert actual == expected, f"version {actual!r} != {expected!r}"' "$RELEASE_TAG"

  deploy_homebrew_tap:
    name: Deploy the verified Homebrew formula
    needs: verify_homebrew_formula
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staging-homebrew-formula
          path: staging-formula
      - name: Prepare an exact one-formula tap commit over public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          formula_name=$(cat staging-formula/formula-name)
          case "$formula_name" in
            pixiv-cli|pixiv-cli-beta) ;;
            *) exit 1 ;;
          esac
          test -f "staging-formula/$formula_name.rb"
          test "$(find staging-formula -maxdepth 1 -type f -print | LC_ALL=C sort)" = "$(printf '%s\n%s\n' staging-formula/formula-name "staging-formula/$formula_name.rb" | LC_ALL=C sort)"
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          git clone https://github.com/FlanChanXwO/homebrew-tap.git "$tap_dir"
          git -C "$tap_dir" config user.name github-actions[bot]
          git -C "$tap_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p "$tap_dir/Formula"
          cp "staging-formula/$formula_name.rb" "$tap_dir/Formula/$formula_name.rb"
          git -C "$tap_dir" add -- "Formula/$formula_name.rb"
          test "$(git -C "$tap_dir" diff --cached --name-only)" = "Formula/$formula_name.rb"
          test -z "$(git -C "$tap_dir" status --porcelain | sed -n '\|^?? |p')"
          git -C "$tap_dir" commit -m "${RELEASE_TAG}: update $formula_name formula"
      - name: Push the verified formula with the protected deploy key
        shell: bash
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -eu
          umask 077
          key_path="$RUNNER_TEMP/homebrew-tap-deploy-key"
          trap 'rm -f "$key_path"' EXIT HUP INT TERM
          test -n "$HOMEBREW_TAP_DEPLOY_KEY"
          # OpenSSH 私钥必须以换行结尾；secret 是否保留末尾 LF 不应影响部署。
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$key_path"
          chmod 600 "$key_path"
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          git -C "$tap_dir" remote set-url origin git@github.com:FlanChanXwO/homebrew-tap.git
          GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/templates/homebrew/github.com-known-hosts" \
            git -C "$tap_dir" push origin HEAD:main
