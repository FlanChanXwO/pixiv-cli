name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

# 版本、checkout、Release、Formula 与 Container 全部绑定触发 workflow 的 immutable tag。
env:
  RELEASE_TAG: ${{ github.ref_name }}

# 令每个 job 显式声明自己所需的最小 token 权限。
permissions: {}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      - name: Validate release SemVer
        shell: bash
        run: go run ./scripts/cmd/releaseassets validate --version "${RELEASE_TAG#v}"
      - name: Verify the exact immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) printf '%s\n' 'release tag must start with v and a digit' >&2; exit 1 ;;
          esac
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          tag_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          tag_skill="$RUNNER_TEMP/pixiv-cli-SKILL.md"
          git show "$RELEASE_TAG:skills/pixiv-cli/SKILL.md" > "$tag_skill"
          go run ./scripts/cmd/releaseassets validate-source --version "${RELEASE_TAG#v}" --product-skill "$tag_skill"
          git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"
          set +e
          response=$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)
          api_status=$?
          set -e
          if [ "$api_status" -eq 0 ]; then
            printf '%s\n' 'a Release already exists for the requested tag' >&2
            exit 1
          fi
          printf '%s\n' "$response" | grep -Eq 'HTTP/[0-9.]+ 404|HTTP 404'
      - name: Statically check release workflow policy
        shell: bash
        run: go run ./scripts/cmd/releaseworkflow --workflow .github/workflows/release.yml

  e2e:
    name: SDK E2E contract gate
    needs:
      - validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      - name: Run offline SDK E2E contract tests
        shell: bash
        run: |
          set -euo pipefail
          test -z "${PIXIV_SDK_E2E:-}"
          test -z "${FANBOX_SDK_E2E:-}"
          go test ./e2e -count=1 -v

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - validate
      - e2e
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CC: ${{ matrix.cc }}
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
      # Git for Windows 会按 runner 默认值把 immutable tag 的 Go 源码转换为 CRLF；质量门必须
      # 检查 Git blob 的 LF bytes，避免 gofmt 将 checkout 转换误报为源码格式错误。
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            rust_target: x86_64-apple-darwin
            rust_toolchain: '1.96.0'
            artifact: darwin-amd64
            cc: clang
          - runner: macos-15
            goos: darwin
            goarch: arm64
            rust_target: aarch64-apple-darwin
            rust_toolchain: '1.96.1'
            artifact: darwin-arm64
            cc: clang
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
            rust_toolchain: '1.96.1'
            artifact: linux-amd64
            cc: gcc
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
            rust_toolchain: '1.96.1'
            artifact: linux-arm64
            cc: gcc
          - runner: windows-2025
            goos: windows
            goarch: amd64
            rust_target: x86_64-pc-windows-msvc
            rust_toolchain: '1.96.0'
            artifact: windows-amd64
            cc: clang -fuse-ld=lld
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            rust_target: aarch64-pc-windows-msvc
            rust_toolchain: '1.96.1'
            artifact: windows-arm64
            cc: clang -fuse-ld=lld
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      # 质量门从不可变 tag 读取 workflow、版本、CHANGELOG 与 Release notes。
      - name: Validate the exact immutable release source
        shell: bash
        run: go run ./scripts/cmd/releaseassets validate-source --version "${RELEASE_TAG#v}" --product-skill skills/pixiv-cli/SKILL.md
      - name: Install the pinned native Rust toolchain
        shell: bash
        run: rustup toolchain install '${{ matrix.rust_toolchain }}' --profile minimal --component 'clippy,rustfmt' --target '${{ matrix.rust_target }}' --no-self-update
      - name: Check vendored Rust sources
        shell: bash
        run: sh scripts/test-rust-vendor.sh
      - name: Check Rust formatting from vendored sources
        shell: bash
        working-directory: internal/media/ugoira/rust
        run: cargo fmt --check
      - name: Lint vendored Rust sources
        shell: bash
        working-directory: internal/media/ugoira/rust
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Test Go sources
        shell: bash
        run: go test ./...
      - name: Test Go sources with the race detector
        # Go 1.26.3 明确不支持 windows/arm64 的 -race；其余五个原生目标仍必须执行 race gate。
        if: matrix.goos != 'windows' || matrix.goarch != 'arm64'
        shell: bash
        run: go test -race ./...
      - name: Vet Go sources
        shell: bash
        run: go vet ./...
      - name: Audit bundled licenses
        shell: bash
        run: go run ./scripts/cmd/licensebundle --check
      - name: Test release packages
        shell: bash
        run: sh scripts/test-package-release.sh
      - name: Install the pinned pre-commit version
        shell: bash
        run: python -m pip install --disable-pip-version-check pre-commit==4.6.0
      - name: Run pre-commit checks
        shell: bash
        run: python -m pre_commit run --all-files

  # 生产资产在独立 runner 上从 immutable tag 重建，避免测试进程的副作用影响 Release。
  build_production:
    name: Build production ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CC: ${{ matrix.cc }}
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            rust_target: x86_64-apple-darwin
            rust_toolchain: '1.96.0'
            artifact: darwin-amd64
            cc: clang
          - runner: macos-15
            goos: darwin
            goarch: arm64
            rust_target: aarch64-apple-darwin
            rust_toolchain: '1.96.1'
            artifact: darwin-arm64
            cc: clang
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
            rust_toolchain: '1.96.1'
            artifact: linux-amd64
            cc: gcc
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
            rust_toolchain: '1.96.1'
            artifact: linux-arm64
            cc: gcc
          - runner: windows-2025
            goos: windows
            goarch: amd64
            rust_target: x86_64-pc-windows-msvc
            rust_toolchain: '1.96.0'
            artifact: windows-amd64
            cc: clang -fuse-ld=lld
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            rust_target: aarch64-pc-windows-msvc
            rust_toolchain: '1.96.1'
            artifact: windows-arm64
            cc: clang -fuse-ld=lld
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
          cache: false
      - name: Validate the exact immutable production source
        shell: bash
        run: go run ./scripts/cmd/releaseassets validate-source --version "${RELEASE_TAG#v}" --product-skill skills/pixiv-cli/SKILL.md
      - name: Install the pinned native Rust toolchain
        shell: bash
        run: rustup toolchain install '${{ matrix.rust_toolchain }}' --profile minimal --target '${{ matrix.rust_target }}' --no-self-update
      - name: Rebuild the selected static library from the immutable tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git clean -ndx)"
          bash scripts/build-staticlibs.sh --target '${{ matrix.rust_target }}'
          git restore --source="$RELEASE_TAG^{commit}" -- internal/media/ugoira/rust/staticlib/manifest.json
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git clean -ndx)"
      - name: Check the generated diff
        shell: bash
        run: git diff --check
      - name: Build the versioned native executable
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          output='dist/pixiv'
          if [ '${{ matrix.goos }}' = windows ]; then
            output='dist/pixiv.exe'
          fi
          go build -trimpath -buildvcs=false \
            -ldflags "-X github.com/FlanChanXwO/pixiv-cli/internal/shared/buildinfo.Version=${RELEASE_TAG}" \
            -o "$output" ./cmd/pixiv
          if [ '${{ matrix.goos }}' = linux ]; then
            go run ./scripts/cmd/linuxabi --binary "$output"
          fi
      - name: Package the fixed-name platform asset
        shell: bash
        run: |
          go run ./scripts/cmd/releaseassets package \
            --repo-root . \
            --version "${RELEASE_TAG#v}" \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --binary "dist/pixiv${{ matrix.goos == 'windows' && '.exe' || '' }}" \
            --output-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-${{ matrix.artifact }}
          path: dist/pixiv-cli_*
          if-no-files-found: error
          retention-days: 1

  # 容器与生产资产共享同一个质量门禁，并在其后的原生 runner 上并行构建。
  # 镜像本身不获得 registry 写权限；只产出本地验证过的 OCI artifact。
  build_container:
    name: Build container ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
            rust_toolchain: '1.96.1'
            artifact: linux-amd64
            cc: gcc
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
            rust_toolchain: '1.96.1'
            artifact: linux-arm64
            cc: gcc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      - name: Validate the immutable container source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          go run ./scripts/cmd/releaseassets validate-source --version "${RELEASE_TAG#v}" --product-skill skills/pixiv-cli/SKILL.md
      - name: Install the pinned native Rust toolchain
        shell: bash
        run: rustup toolchain install '${{ matrix.rust_toolchain }}' --profile minimal --target '${{ matrix.rust_target }}' --no-self-update
      - name: Rebuild the selected static library from the immutable tag
        shell: bash
        run: |
          set -euo pipefail
          CC='${{ matrix.cc }}' RUSTUP_TOOLCHAIN='${{ matrix.rust_toolchain }}' bash scripts/build-staticlibs.sh --target '${{ matrix.rust_target }}'
          git restore --source="$RELEASE_TAG^{commit}" -- internal/media/ugoira/rust/staticlib/manifest.json
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git clean -ndx)"
      - name: Build and verify the versioned Linux executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CC='${{ matrix.cc }}' go build -trimpath -buildvcs=false \
            -ldflags "-X github.com/FlanChanXwO/pixiv-cli/internal/shared/buildinfo.Version=${RELEASE_TAG}" \
            -o dist/pixiv ./cmd/pixiv
          go run ./scripts/cmd/linuxabi --binary dist/pixiv
      - name: Check the container packaging contract
        shell: bash
        run: go test ./scripts/tests/containerrelease -count=1
      - name: Build the verified container image
        shell: bash
        run: |
          docker build \
            --build-arg REVISION="$(git rev-parse "$RELEASE_TAG^{commit}")" \
            --build-arg VERSION='${RELEASE_TAG}' \
            --platform 'linux/${{ matrix.goarch }}' \
            --tag "pixiv-cli:${RELEASE_TAG}-${{ matrix.artifact }}" .
      # Includes the embedded license-notices bundle in every architecture check.
      - name: Verify image provenance and runtime contract
        shell: bash
        env:
          IMAGE: pixiv-cli:${{ env.RELEASE_TAG }}-${{ matrix.artifact }}
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id "$IMAGE" -u)
          test "$uid" != 0
          version=$(docker run --rm "$IMAGE" --version)
          test "$version" = "pixiv ${RELEASE_TAG}"
          docker run --rm "$IMAGE" config path | grep -F '/home/pixiv/.pixiv-cli/'
          test "$(docker run --rm --entrypoint sh "$IMAGE" -c pwd)" = /work
          docker run --rm --entrypoint sh "$IMAGE" -c '
            test -s /usr/share/doc/pixiv-cli/LICENSE &&
            test -s /usr/share/doc/pixiv-cli/THIRD_PARTY_LICENSES.md &&
            find /usr/share/doc/pixiv-cli/third_party/licenses -type f | grep -q .
          '
          inspect_label() {
            docker image inspect --format '{{ index .Config.Labels "'"$1"'" }}' "$IMAGE"
          }
          test "$(inspect_label org.opencontainers.image.revision)" = "$(git rev-parse HEAD)"
          test "$(inspect_label org.opencontainers.image.version)" = "${RELEASE_TAG}"
          test "$(inspect_label org.opencontainers.image.source)" = "https://github.com/FlanChanXwO/pixiv-cli"
          test "$(inspect_label org.opencontainers.image.licenses)" = "MIT"
      - name: Export the verified image artifact
        shell: bash
        run: docker save --output "${RUNNER_TEMP}/pixiv-cli-${{ matrix.artifact }}.tar" "pixiv-cli:${RELEASE_TAG}-${{ matrix.artifact }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-container-${{ matrix.artifact }}
          path: ${{ runner.temp }}/pixiv-cli-${{ matrix.artifact }}.tar
          if-no-files-found: error
          # publish_container 的恢复输入不能一天后消失；90 天覆盖 registry 修复窗口。
          retention-days: 90

  # 在进入受保护的 publish job 前，以 tag 内不可变说明、GitHub PR 关联和实际提交范围交叉核对发布来源。
  release_notes_audit:
    name: Audit release notes provenance
    needs: build_production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      - name: Audit release sources and validate the bilingual tag notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_tag=$(git tag --merged "$RELEASE_TAG^" --sort=-version:refname | head -n 1)
          test -n "$previous_tag"
          audit_report="$RUNNER_TEMP/release-notes-audit.json"
          go run ./scripts/cmd/releasenotes audit \
            --repo "$GITHUB_REPOSITORY" \
            --from "$previous_tag" \
            --to "$RELEASE_TAG" \
            --output "$audit_report"
          go run ./scripts/cmd/releasenotes validate \
            --version "${RELEASE_TAG#v}" \
            --dir "changelog/$RELEASE_TAG" \
            --previous "$previous_tag" \
            --audit "$audit_report"

  # 在不声明 environment 的 job 中验证 tag 所指提交属于默认分支，避免 protected
  # release Environment 的 secret 在 ancestry shell gate 之前进入同一 job 生命周期。
  verify_release_source:
    name: Verify release source trust
    needs:
      - build_production
      - release_notes_audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Require the tag commit on the default release branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"

  publish:
    name: Sign and publish the GitHub Release
    needs:
      - build_container
      - verify_release_source
    runs-on: ubuntu-24.04
    # Task 20 must create this protected Environment and store the signing values
    # as its secrets, rather than repository secrets available to arbitrary tags.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-darwin-amd64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-darwin-arm64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-linux-amd64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-linux-arm64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-windows-amd64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-windows-arm64
          path: dist
      - name: Create the signed release metadata
        shell: bash
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_SIGNING_KEY_ID: ${{ secrets.RELEASE_SIGNING_KEY_ID }}
        run: |
          set -eu
          umask 077
          key_path="$RUNNER_TEMP/pixiv-release-ed25519.pem"
          trap 'rm -f "$key_path"' EXIT HUP INT TERM
          test -n "$RELEASE_SIGNING_PRIVATE_KEY"
          test -n "$RELEASE_SIGNING_KEY_ID"
          printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY" > "$key_path"
          go run ./scripts/cmd/releaseassets finalize \
            --version "${RELEASE_TAG#v}" \
            --input-dir dist \
            --output-dir release \
            --install-sh scripts/install.sh \
            --install-cmd scripts/install.cmd \
            --release-sources internal/update/source/release_sources.txt \
            --key-id "$RELEASE_SIGNING_KEY_ID" \
            --private-key "$key_path" \
            --changelog "changelog/v${RELEASE_TAG#v}/en.md" \
            --changelog-zh "changelog/v${RELEASE_TAG#v}/zh-CN.md"
      - name: Publish only the verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          prerelease=()
          case "$(go run ./scripts/cmd/releaseassets channel --version "${RELEASE_TAG#v}")" in
            stable)
              ;;
            prerelease)
              prerelease+=(--prerelease)
              ;;
            *)
              printf '%s\n' 'unexpected release classification' >&2
              exit 1
              ;;
          esac
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release/release-notes.md \
            "${prerelease[@]}" \
            release/pixiv-cli_*.tar.gz \
            release/pixiv-cli_*.zip \
            release/install.sh \
            release/install.cmd \
            release/checksums.txt \
            release/checksums.json
          expected=$(find release -maxdepth 1 -type f ! -name release-notes.md -exec basename {} \; | LC_ALL=C sort)
          actual=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          if [ "$actual" != "$expected" ]; then
            printf '%s\n' 'draft release assets differ from the verified local set' >&2
            printf '%s\n' "expected:$expected" >&2
            printf '%s\n' "actual:$actual" >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false
      # 该 artifact 与已发布 Release 使用同一个本地 checksums.txt；下游不得重新下载或重算。
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-checksums
          path: release/checksums.txt
          if-no-files-found: error
          retention-days: 1


  # GHCR 与 GitHub Release 无法原子提交；这里把推送隔离为 post-Release 恢复路径。
  # 失败必须保留 workflow failure，可通过重跑本 job 复用同一批已验证 artifact。
  publish_container:
    name: Publish the multi-architecture container image
    needs:
      - build_container
      - publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-container-linux-amd64
          path: containers/linux-amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-container-linux-arm64
          path: containers/linux-arm64
      - name: Load the verified container artifacts
        shell: bash
        run: |
          set -euo pipefail
          docker load --input containers/linux-amd64/pixiv-cli-linux-amd64.tar
          docker load --input containers/linux-arm64/pixiv-cli-linux-arm64.tar
      - name: Authenticate to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push architecture-specific verified images
        shell: bash
        run: |
          set -euo pipefail
          docker tag "pixiv-cli:${RELEASE_TAG}-linux-amd64" "ghcr.io/flanchanxwo/pixiv-cli:${RELEASE_TAG}-linux-amd64"
          docker push "ghcr.io/flanchanxwo/pixiv-cli:${RELEASE_TAG}-linux-amd64"
          docker tag "pixiv-cli:${RELEASE_TAG}-linux-arm64" "ghcr.io/flanchanxwo/pixiv-cli:${RELEASE_TAG}-linux-arm64"
          docker push "ghcr.io/flanchanxwo/pixiv-cli:${RELEASE_TAG}-linux-arm64"
      - name: Publish the exact-version multi-architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          docker manifest create "ghcr.io/flanchanxwo/pixiv-cli:${RELEASE_TAG}" \
            --amend "ghcr.io/flanchanxwo/pixiv-cli:${RELEASE_TAG}-linux-amd64" \
            --amend "ghcr.io/flanchanxwo/pixiv-cli:${RELEASE_TAG}-linux-arm64"
          docker manifest push "ghcr.io/flanchanxwo/pixiv-cli:${RELEASE_TAG}"
      - name: Advance latest only for the newest stable release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          channel=$(go run ./scripts/cmd/releaseassets channel --version "${RELEASE_TAG#v}")
          case "$channel" in
            stable)
              latest_stable_tag=$(
                GH_TOKEN="$GITHUB_TOKEN" gh api --paginate \
                  "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
                  --jq '.[].ref | sub("^refs/tags/"; "")' \
                | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
                | sort -Vr | head -n1
              )
              test "${RELEASE_TAG}" = "${latest_stable_tag}"
              docker manifest create "ghcr.io/flanchanxwo/pixiv-cli:latest" \
                --amend "ghcr.io/flanchanxwo/pixiv-cli:${RELEASE_TAG}-linux-amd64" \
                --amend "ghcr.io/flanchanxwo/pixiv-cli:${RELEASE_TAG}-linux-arm64"
              docker manifest push "ghcr.io/flanchanxwo/pixiv-cli:latest"
              ;;
            prerelease)
              printf '%s\n' 'prerelease keeps the latest tag unchanged' >&2
              ;;
            *)
              printf '%s\n' 'unexpected release classification' >&2
              exit 1
              ;;
          esac

  render_homebrew_formula:
    name: Render the channel Homebrew formula
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-checksums
          path: verified-release
      - name: Render exactly one channel formula from the published checksums
        shell: bash
        run: |
          set -eu
          version="${RELEASE_TAG#v}"
          case "$(go run ./scripts/cmd/releaseassets channel --version "$version")" in
            stable)
              formula_name=pixiv-cli
              ;;
            prerelease)
              formula_name=pixiv-cli-beta
              ;;
            *)
              printf '%s\n' 'unexpected release classification' >&2
              exit 1
              ;;
          esac
          mkdir -p staging-formula
          go run ./scripts/cmd/homebrewformula render \
            --formula "$formula_name" \
            --version "$version" \
            --checksums verified-release/checksums.txt \
            --output "staging-formula/$formula_name.rb"
          printf '%s\n' "$formula_name" > staging-formula/formula-name
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-homebrew-formula
          path: staging-formula
          if-no-files-found: error
          retention-days: 1

  verify_homebrew_formula:
    name: Verify Homebrew on ${{ matrix.os }}/${{ matrix.arch }}
    needs: render_homebrew_formula
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: ubuntu-22.04
            os: linux
            arch: amd64
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staging-homebrew-formula
          path: staging-formula
      - name: Install the staging formula and verify its embedded version
        shell: bash
        run: |
          set -euo pipefail
          formula_name=$(cat staging-formula/formula-name)
          case "$formula_name" in
            pixiv-cli|pixiv-cli-beta) ;;
            *) exit 1 ;;
          esac
          test "$(find staging-formula -maxdepth 1 -type f -print | LC_ALL=C sort)" = "$(printf '%s\n%s\n' staging-formula/formula-name "staging-formula/$formula_name.rb" | LC_ALL=C sort)"
          if [ '${{ matrix.os }}' = linux ]; then
            staging_dir="$(pwd)/staging-formula"
            case "$staging_dir" in /*) ;; *) exit 1 ;; esac
            docker run --rm \
              --mount "type=bind,src=$staging_dir,dst=/staging-formula,readonly" \
              --env RELEASE_TAG \
              --env HOMEBREW_NO_AUTO_UPDATE=1 \
              --env HOMEBREW_NO_ENV_HINTS=1 \
              --entrypoint bash \
              homebrew/brew@sha256:b0072bfdebf5934ae24b93b44a1928a88057399b3283ffa0177bb86084fdedfd \
              -euo pipefail -c '
                formula_name=$(cat /staging-formula/formula-name)
                case "$formula_name" in
                  pixiv-cli|pixiv-cli-beta) ;;
                  *) exit 1 ;;
                esac
                test "$(find /staging-formula -maxdepth 1 -type f -print | LC_ALL=C sort)" = "$(printf "%s\\n%s\\n" /staging-formula/formula-name "/staging-formula/$formula_name.rb" | LC_ALL=C sort)"
                staging_tap=pixiv-cli-release/staging
                tap_dir="$(brew --repository)/Library/Taps/pixiv-cli-release/homebrew-staging"
                brew tap-new "$staging_tap" --no-git
                cp "/staging-formula/$formula_name.rb" "$tap_dir/Formula/$formula_name.rb"
                brew install --formula "$staging_tap/$formula_name"
                test "$(pixiv --version)" = "pixiv $RELEASE_TAG"
              '
          else
            staging_tap=pixiv-cli-release/staging
            tap_dir="$(brew --repository)/Library/Taps/pixiv-cli-release/homebrew-staging"
            brew tap-new "$staging_tap" --no-git
            brew trust --tap "$staging_tap"
            cp "staging-formula/$formula_name.rb" "$tap_dir/Formula/$formula_name.rb"
            brew install --formula "$staging_tap/$formula_name"
            test "$(pixiv --version)" = "pixiv $RELEASE_TAG"
          fi

  deploy_homebrew_tap:
    name: Deploy the verified Homebrew formula
    needs: verify_homebrew_formula
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: staging-homebrew-formula
          path: staging-formula
      - name: Prepare an exact one-formula tap commit over public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          formula_name=$(cat staging-formula/formula-name)
          case "$formula_name" in
            pixiv-cli|pixiv-cli-beta) ;;
            *) exit 1 ;;
          esac
          test -f "staging-formula/$formula_name.rb"
          test "$(find staging-formula -maxdepth 1 -type f -print | LC_ALL=C sort)" = "$(printf '%s\n%s\n' staging-formula/formula-name "staging-formula/$formula_name.rb" | LC_ALL=C sort)"
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          git clone https://github.com/FlanChanXwO/homebrew-tap.git "$tap_dir"
          git -C "$tap_dir" config user.name github-actions[bot]
          git -C "$tap_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p "$tap_dir/Formula"
          cp "staging-formula/$formula_name.rb" "$tap_dir/Formula/$formula_name.rb"
          git -C "$tap_dir" add -- "Formula/$formula_name.rb"
          test "$(git -C "$tap_dir" diff --cached --name-only)" = "Formula/$formula_name.rb"
          test -z "$(git -C "$tap_dir" status --porcelain | sed -n '\|^?? |p')"
          git -C "$tap_dir" commit -m "${RELEASE_TAG}: update $formula_name formula"
      - name: Push the verified formula with the protected deploy key
        shell: bash
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -eu
          umask 077
          key_path="$RUNNER_TEMP/homebrew-tap-deploy-key"
          trap 'rm -f "$key_path"' EXIT HUP INT TERM
          test -n "$HOMEBREW_TAP_DEPLOY_KEY"
          # OpenSSH 私钥必须以换行结尾；secret 是否保留末尾 LF 不应影响部署。
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$key_path"
          chmod 600 "$key_path"
          tap_dir="$RUNNER_TEMP/homebrew-tap"
          git -C "$tap_dir" remote set-url origin git@github.com:FlanChanXwO/homebrew-tap.git
          GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/templates/homebrew/github.com-known-hosts" \
            git -C "$tap_dir" push origin HEAD:main
      # workflow_run 在恢复发布时的 head_branch 是 main，不能据此推断版本。仅在公开
      # Release 与 Homebrew 都成功后交出精确 tag，供下游 SkillHub workflow 重新验证。
      - name: Export the completed release tag for the SkillHub handoff
        shell: bash
        run: |
          set -eu
          mkdir -p skillhub-release-tag
          printf '%s\n' "$RELEASE_TAG" > skillhub-release-tag/release-tag
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skillhub-release-tag
          path: skillhub-release-tag/release-tag
          if-no-files-found: error
          retention-days: 1
