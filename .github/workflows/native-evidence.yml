name: Native staticlib evidence

# 这个入口绝不发布、签名、推送或创建 tag。Task 20 将唯一一次经审计的 main push
# 触发六个平台 runner；手动 dispatch 只限同一受审计 main workflow 使用。
on:
  push:
    branches:
      - main
    # 文档专用改动不改变受审计 staticlib 或打包输入，避免无意义地占用六个平台 runner。
    # 未匹配的任一文件仍会触发完整 evidence；手动 dispatch 也始终运行完整矩阵。
    paths-ignore:
      - 'README*.md'
      - 'docs/**'
      - 'changelog/**'
      - 'skills/**'
  workflow_dispatch: {}

permissions: {}

jobs:
  native_evidence:
    name: Native evidence ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            rust_target: x86_64-apple-darwin
            rust_toolchain: '1.96.0'
            artifact: darwin-amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
            rust_target: aarch64-apple-darwin
            rust_toolchain: '1.96.1'
            artifact: darwin-arm64
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
            rust_toolchain: '1.96.1'
            artifact: linux-amd64
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
            rust_toolchain: '1.96.1'
            artifact: linux-arm64
          - runner: windows-2025
            goos: windows
            goarch: amd64
            rust_target: x86_64-pc-windows-msvc
            rust_toolchain: '1.96.0'
            artifact: windows-amd64
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            rust_target: aarch64-pc-windows-msvc
            rust_toolchain: '1.96.1'
            artifact: windows-arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      - name: Check native evidence workflow policy
        shell: bash
        run: go run ./scripts/cmd/nativeevidence policy --workflow .github/workflows/native-evidence.yml
      - name: Require audited main ref
        shell: bash
        run: test "$GITHUB_REF" = 'refs/heads/main'
      - name: Install the pinned native Rust toolchain
        shell: bash
        run: rustup toolchain install '${{ matrix.rust_toolchain }}' --profile minimal --target '${{ matrix.rust_target }}' --no-self-update
      - name: Check vendored Rust sources
        shell: bash
        run: sh scripts/test-rust-vendor.sh
      - name: Build the native Rust static library
        shell: bash
        run: bash scripts/build-staticlibs.sh --target '${{ matrix.rust_target }}'
      - name: Run native GIF/APNG smoke
        shell: bash
        run: |
          set -eu
          if [ '${{ matrix.goos }}' = windows ]; then
            export CC='clang -fuse-ld=lld'
          fi
          go test ./internal/media/ugoira -run '^TestRustUgoiraEncoderNativeGIFAndAPNG$' -count=1
      - name: Build and run the versioned native binary
        shell: bash
        run: |
          set -eu
          if [ '${{ matrix.goos }}' = windows ]; then
            export CC='clang -fuse-ld=lld'
          fi
          version="0.1.0-native-evidence.${GITHUB_RUN_ID}"
          go run ./scripts/cmd/releaseassets validate --version "$version"
          mkdir -p evidence
          binary='evidence/pixiv'
          if [ '${{ matrix.goos }}' = windows ]; then
            binary='evidence/pixiv.exe'
          fi
          go build -trimpath -buildvcs=false \
            -ldflags "-X github.com/FlanChanXwO/pixiv-cli/internal/shared/buildinfo.Version=v${version}" \
            -o "$binary" ./cmd/pixiv
          if [ '${{ matrix.goos }}' = linux ]; then
            go run ./scripts/cmd/linuxabi --binary "$binary"
          fi
          "$binary" --version
      - name: Package the versioned native binary
        shell: bash
        run: |
          set -eu
          version="0.1.0-native-evidence.${GITHUB_RUN_ID}"
          binary='evidence/pixiv'
          if [ '${{ matrix.goos }}' = windows ]; then
            binary='evidence/pixiv.exe'
          fi
          go run ./scripts/cmd/releaseassets package \
            --repo-root . \
            --version "$version" \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --binary "$binary" \
            --output-dir evidence
      - name: Record staticlib, binary and archive evidence
        shell: bash
        run: |
          set -eu
          version="0.1.0-native-evidence.${GITHUB_RUN_ID}"
          staticlib='libugoira_rs.a'
          if [ '${{ matrix.goos }}' = windows ]; then
            staticlib='ugoira_rs.lib'
          fi
          cp "internal/media/ugoira/rust/staticlib/${{ matrix.rust_target }}/$staticlib" "evidence/$staticlib"
          archive="evidence/pixiv-cli_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ '${{ matrix.goos }}' = windows ]; then
            archive="$archive.zip"
          else
            archive="$archive.tar.gz"
          fi
          binary='evidence/pixiv'
          if [ '${{ matrix.goos }}' = windows ]; then
            binary='evidence/pixiv.exe'
          fi
          go run ./scripts/cmd/nativeevidence record \
            --repo-root . \
            --version "$version" \
            --source-commit "$GITHUB_SHA" \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --rust-target '${{ matrix.rust_target }}' \
            --staticlib "evidence/$staticlib" \
            --binary "$binary" \
            --archive "$archive" \
            --output evidence/native-evidence.json
      - name: Upload native evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-evidence-${{ matrix.artifact }}
          path: evidence
          if-no-files-found: error
