name: Container image smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: container-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  classify_changes:
    name: Classify change scope
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      container_required: ${{ steps.scope.outputs.container_required }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Detect documentation-only changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            {
              printf '%s\n' 'docs_only=false'
              printf '%s\n' 'quality_required=true'
              printf '%s\n' 'platform_required=true'
              printf '%s\n' 'container_required=true'
              printf '%s\n' 'native_required=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          go run ./scripts/cmd/changescope --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  resolve_platforms:
    name: Container setup
    needs: classify_changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Resolve container platforms
        id: matrix
        shell: bash
        env:
          REQUIRED: ${{ needs.classify_changes.outputs.container_required }}
        run: |
          set -euo pipefail
          # worker 始终运行：被 skip 的 matrix job 会让 GitHub 原样显示
          # `${{ matrix.* }}` 占位符。非必需时只产出单个占位条目，名称里说明
          # 跳过原因，并落到便宜的 ubuntu runner，不占用容器 runner。
          if [ "$REQUIRED" = true ]; then
            raw=$(go run ./tools/platformmatrix --capability container)
            matrix=$(printf '%s' "$raw" | jq -c '.include |= map(. + {display: (.goos + "/" + .goarch), required: "true"})')
          else
            matrix=$(jq -nc '{include:[{display:"not required", required:"false", runner:"ubuntu-24.04"}]}')
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  container_smoke:
    needs: [classify_changes, resolve_platforms]
    # 刻意不加 job 级 if：被 skip 的 matrix job 会让 GitHub 原样显示
    # `${{ matrix.* }}` 占位符。改为始终运行，非必需时落到便宜的
    # ubuntu-24.04 并在 step 层跳过全部重活。
    name: Container smoke · ${{ matrix.display }}
    runs-on: ${{ matrix.required == 'true' && matrix.runner || 'ubuntu-24.04' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_platforms.outputs.matrix) }}
    env:
      CC: ${{ matrix.cc }}
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
    steps:
      - name: Mark the change as not requiring container smoke
        if: matrix.required != 'true'
        shell: bash
        run: printf '%s\n' 'Container smoke is not required for this change.'

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: matrix.required == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: matrix.required == 'true'
        with:
          go-version-file: go.mod
      - name: Install the native Rust toolchain
        if: matrix.required == 'true'
        shell: bash
        run: rustup toolchain install '${{ matrix.rust_toolchain }}' --profile minimal --target '${{ matrix.rust_target }}' --no-self-update
      - name: Build the versioned Linux binary
        if: matrix.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          binary=$(sh scripts/build-platform.sh \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --rust-target '${{ matrix.rust_target }}' \
            --cc '${{ matrix.cc }}' \
            --version 0.0.0-smoke \
            --output-dir dist)
          test "$binary" = dist/pixiv
      - name: Build the container image
        if: matrix.required == 'true'
        shell: bash
        run: docker build -t pixiv-cli-smoke:${{ matrix.goarch }} .
      - name: Verify non-root user
        if: matrix.required == 'true'
        shell: bash
        run: |
          uid=$(docker run --rm --entrypoint id pixiv-cli-smoke:${{ matrix.goarch }} -u)
          if [ "$uid" = "0" ]; then
            echo "Container must not run as root (UID 0)" >&2
            exit 1
          fi
      - name: Verify exact release version
        if: matrix.required == 'true'
        shell: bash
        run: |
          version=$(docker run --rm pixiv-cli-smoke:${{ matrix.goarch }} --version)
          if [ "$version" != "pixiv v0.0.0-smoke" ]; then
            echo "Version mismatch: expected 'pixiv v0.0.0-smoke', got '$version'" >&2
            exit 1
          fi
      - name: Verify state path
        if: matrix.required == 'true'
        shell: bash
        run: |
          config_path=$(docker run --rm pixiv-cli-smoke:${{ matrix.goarch }} config path)
          if ! echo "$config_path" | grep -q '/home/pixiv/.pixiv-cli/'; then
            echo "State path must resolve to /home/pixiv/.pixiv-cli/" >&2
            exit 1
          fi
      - name: Verify working directory
        if: matrix.required == 'true'
        shell: bash
        run: |
          workdir=$(docker run --rm --entrypoint sh pixiv-cli-smoke:${{ matrix.goarch }} -c 'pwd')
          if [ "$workdir" != "/work" ]; then
            echo "Working directory must be /work, got '$workdir'" >&2
            exit 1
          fi
      - name: Verify embedded license-notices bundle
        if: matrix.required == 'true'
        shell: bash
        run: |
          docker run --rm --entrypoint sh pixiv-cli-smoke:${{ matrix.goarch }} -c '
            test -s /usr/share/doc/pixiv-cli/LICENSE &&
            test -s /usr/share/doc/pixiv-cli/THIRD_PARTY_LICENSES.md &&
            find /usr/share/doc/pixiv-cli/third_party/licenses -type f | grep -q .
          '
      - name: Run container release contract tests
        if: matrix.required == 'true'
        shell: bash
        run: go test ./scripts/tests/containerrelease -count=1

  container_smoke_gate:
    name: Container smoke gate
    needs: [classify_changes, resolve_platforms, container_smoke]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require expected container outcome
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify_changes.result }}
          CONTAINER_REQUIRED: ${{ needs.classify_changes.outputs.container_required }}
          RESOLVE_RESULT: ${{ needs.resolve_platforms.result }}
          MATRIX_RESULT: ${{ needs.container_smoke.result }}
        run: |
          set -euo pipefail
          # §12.1：失败时必须给出可操作原因，而不是只有退出码。
          if [ "$CLASSIFY_RESULT" != success ]; then
            echo '::error::Container configuration could not be resolved.'
            exit 1
          fi
          if [ "$RESOLVE_RESULT" != success ]; then
            echo '::error::Container configuration could not be resolved.'
            exit 1
          fi
          if [ "$MATRIX_RESULT" != success ]; then
            echo '::error::Container smoke failed on one or more required platforms.'
            exit 1
          fi
          # §12.2：合法跳过必须解释原因。
          if [ "$CONTAINER_REQUIRED" != true ]; then
            printf '%s\n' 'Container smoke is not required for this change.'
          fi
