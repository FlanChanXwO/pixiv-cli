name: Container smoke workers

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for this worker run
        required: false
        default: ''
        type: string
      head_sha:
        description: Exact source commit to verify
        required: false
        default: ''
        type: string

concurrency:
  group: container-smoke-worker-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  setup:
    name: Resolve container workers
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve container matrix
        id: matrix
        shell: bash
        run: go run ./tools/platformmatrix --capability container --github-output "$GITHUB_OUTPUT"

  worker:
    needs: setup
    name: Container platform - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CC: ${{ matrix.cc }}
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/head', inputs.pr_number) || inputs.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Require the requested source
        if: ${{ inputs.head_sha != '' }}
        shell: bash
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Install the native Rust toolchain
        shell: bash
        run: rustup toolchain install '${{ matrix.rust_toolchain }}' --profile minimal --target '${{ matrix.rust_target }}' --no-self-update
      - name: Build the versioned Linux binary
        shell: bash
        run: |
          set -euo pipefail
          binary=$(sh scripts/build-platform.sh \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --rust-target '${{ matrix.rust_target }}' \
            --cc '${{ matrix.cc }}' \
            --version 0.0.0-smoke \
            --output-dir dist)
          test "$binary" = dist/pixiv
      - name: Build the container image
        shell: bash
        run: docker build -t pixiv-cli-smoke:${{ matrix.goarch }} .
      - name: Verify non-root user
        shell: bash
        run: |
          uid=$(docker run --rm --entrypoint id pixiv-cli-smoke:${{ matrix.goarch }} -u)
          if [ "$uid" = "0" ]; then
            echo "Container must not run as root (UID 0)" >&2
            exit 1
          fi
      - name: Verify exact release version
        shell: bash
        run: |
          version=$(docker run --rm pixiv-cli-smoke:${{ matrix.goarch }} --version)
          if [ "$version" != "pixiv v0.0.0-smoke" ]; then
            echo "Version mismatch: expected 'pixiv v0.0.0-smoke', got '$version'" >&2
            exit 1
          fi
      - name: Verify state path
        shell: bash
        run: |
          config_path=$(docker run --rm pixiv-cli-smoke:${{ matrix.goarch }} config path)
          if ! echo "$config_path" | grep -q '/home/pixiv/.pixiv-cli/'; then
            echo "State path must resolve to /home/pixiv/.pixiv-cli/" >&2
            exit 1
          fi
      - name: Verify working directory
        shell: bash
        run: |
          workdir=$(docker run --rm --entrypoint sh pixiv-cli-smoke:${{ matrix.goarch }} -c 'pwd')
          if [ "$workdir" != "/work" ]; then
            echo "Working directory must be /work, got '$workdir'" >&2
            exit 1
          fi
      - name: Verify embedded license-notices bundle
        shell: bash
        run: |
          docker run --rm --entrypoint sh pixiv-cli-smoke:${{ matrix.goarch }} -c '
            test -s /usr/share/doc/pixiv-cli/LICENSE &&
            test -s /usr/share/doc/pixiv-cli/THIRD_PARTY_LICENSES.md &&
            find /usr/share/doc/pixiv-cli/third_party/licenses -type f | grep -q .
          '
      - name: Run container release contract tests
        shell: bash
        run: go test ./scripts/tests/containerrelease -count=1

  publish:
    if: ${{ always() && inputs.head_sha != '' }}
    needs: [setup, worker]
    name: Publish container smoke result
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      statuses: write
    steps:
      - name: Publish aggregate container smoke status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
          SETUP_RESULT: ${{ needs.setup.result }}
          WORKER_RESULT: ${{ needs.worker.result }}
        run: |
          set -euo pipefail
          state=failure
          description='Container smoke failed on one or more required platforms.'
          failures=
          if [ "$SETUP_RESULT" != success ]; then
            description='Container configuration could not be resolved.'
          elif [ "$WORKER_RESULT" = success ]; then
            state=success
            description='All required container platforms passed.'
          else
            failures=$(gh api --method GET "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs" \
              -f filter=all \
              -f per_page=100 \
              --jq '.jobs[] | select(.name | startswith("Container platform - ")) | select(.conclusion != "success" and .conclusion != "skipped") | "\(.name) (\(.conclusion // .status))"')
            if [ -n "$failures" ]; then
              message=$(printf '%s\n' "$failures" | paste -sd ';' -)
              description="Container smoke failed: $message"
            fi
          fi
          run_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context='Container smoke gate' \
            -f description="${description:0:140}" \
            -f target_url="$run_url" >/dev/null
          if [ "$state" = success ]; then
            printf '%s\n' '### Container smoke' '' "$description" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Container smoke failed::$description"
            {
              printf '%s\n' '### Container smoke failed' ''
              if [ -n "$failures" ]; then
                printf '%s\n' "$failures" | sed 's/^/- /'
              else
                printf '%s\n' "- $description"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
