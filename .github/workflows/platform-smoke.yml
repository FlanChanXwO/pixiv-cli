name: Platform packaged binary smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: platform-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 与 Quality gate 使用相同的严格文档 allowlist，避免 README 等改动占用六个平台 runner。
  classify_changes:
    name: Classify change scope
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      - name: Detect documentation-only changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            printf '%s\n' 'docs_only=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          go run ./scripts/cmd/changescope --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  packaged_binary_smoke:
    needs: classify_changes
    if: ${{ needs.classify_changes.outputs.docs_only != 'true' }}
    name: Packaged binary smoke
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CC: ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            rust_target: x86_64-apple-darwin
            cc: clang
          - runner: macos-15
            goos: darwin
            goarch: arm64
            rust_target: aarch64-apple-darwin
            cc: clang
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
            cc: gcc
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
            cc: gcc
          - runner: windows-2025
            goos: windows
            goarch: amd64
            rust_target: x86_64-pc-windows-msvc
            cc: clang -fuse-ld=lld
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            rust_target: aarch64-pc-windows-msvc
            cc: clang -fuse-ld=lld
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.3'
      - name: Install the native Rust target
        shell: bash
        run: rustup target add '${{ matrix.rust_target }}'
      - name: Check vendored Rust sources
        shell: bash
        run: sh scripts/test-rust-vendor.sh
      - name: Test the platform installer
        shell: bash
        run: go test ./scripts/tests/installers -count=1
      - name: Test platform OAuth callback integration
        shell: bash
        run: go test ./internal/cli/commands/pixiv/auth/loginhelper -count=1
      - name: Build the native Rust static library
        shell: bash
        run: bash scripts/build-staticlibs.sh --target '${{ matrix.rust_target }}'
      - name: Run native GIF/APNG smoke
        shell: bash
        run: go test ./internal/media/ugoira -run '^TestRustUgoiraEncoderNativeGIFAndAPNG$' -count=1
      - name: Build and package a versioned binary
        shell: bash
        run: |
          set -euo pipefail
          version="0.2.0-ci.${GITHUB_RUN_ID}"
          mkdir -p dist
          binary='dist/pixiv'
          if [ '${{ matrix.goos }}' = windows ]; then
            binary='dist/pixiv.exe'
          fi
          go build -trimpath -buildvcs=false \
            -ldflags "-X github.com/FlanChanXwO/pixiv-cli/internal/shared/buildinfo.Version=v${version}" \
            -o "$binary" ./cmd/pixiv
          if [ '${{ matrix.goos }}' = linux ]; then
            go run ./scripts/cmd/linuxabi --binary "$binary"
          fi
          go run ./scripts/cmd/releaseassets package \
            --repo-root . \
            --version "$version" \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --binary "$binary" \
            --output-dir dist
      - name: Extract and smoke the packaged binary
        shell: bash
        run: |
          set -euo pipefail
          version="0.2.0-ci.${GITHUB_RUN_ID}"
          archive="dist/pixiv-cli_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p smoke
          binary='smoke/pixiv'
          if [ '${{ matrix.goos }}' = windows ]; then
            7z x "${archive}.zip" -osmoke
            binary='smoke/pixiv.exe'
          else
            tar -xzf "${archive}.tar.gz" -C smoke
          fi
          test -f "$binary"
          PIXIV_E2E_BINARY="$(pwd)/$binary" \
          PIXIV_E2E_EXPECTED_VERSION="v${version}" \
          go test ./e2e -run '^TestPixivBinaryPackagedSmoke$' -count=1

  # 分支保护只要求此汇总 job：完整变更必须等全部六个 matrix job 成功，文档改动
  # 则确认 matrix 被有意跳过，避免缺失 matrix check 导致 PR 永远处于 pending。
  platform_smoke_gate:
    name: Platform smoke gate
    needs:
      - classify_changes
      - packaged_binary_smoke
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the expected matrix outcome
        shell: bash
        env:
          DOCS_ONLY: ${{ needs.classify_changes.outputs.docs_only }}
          MATRIX_RESULT: ${{ needs.packaged_binary_smoke.result }}
        run: |
          set -euo pipefail
          if [ "$DOCS_ONLY" = true ]; then
            test "$MATRIX_RESULT" = skipped
            exit 0
          fi
          test "$MATRIX_RESULT" = success
