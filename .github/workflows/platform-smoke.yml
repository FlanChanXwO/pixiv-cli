name: Platform packaged binary smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: platform-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # 与 Quality gate 使用相同的严格文档 allowlist，避免 README 等改动占用六个平台 runner。
  classify_changes:
    name: Classify change scope
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      platform_required: ${{ steps.scope.outputs.platform_required }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Detect documentation-only changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            {
              printf '%s\n' 'docs_only=false'
              printf '%s\n' 'quality_required=true'
              printf '%s\n' 'platform_required=true'
              printf '%s\n' 'container_required=true'
              printf '%s\n' 'native_required=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          go run ./scripts/cmd/changescope --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  resolve_platforms:
    name: Platform setup
    needs: classify_changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Resolve smoke platforms
        id: matrix
        shell: bash
        env:
          REQUIRED: ${{ needs.classify_changes.outputs.platform_required }}
        run: |
          set -euo pipefail
          # worker 始终运行：被 skip 的 matrix job 会让 GitHub 原样显示
          # `${{ matrix.* }}` 占位符；静态名则会被自动追加整个 matrix tuple，
          # 两者都违反用户可见 Check name 规范。非必需时只产出单个占位条目，
          # 名称里说明跳过原因，并落到便宜的 ubuntu runner。
          if [ "$REQUIRED" = true ]; then
            raw=$(go run ./tools/platformmatrix --capability smoke)
            matrix=$(printf '%s' "$raw" | jq -c '.include |= map(. + {display: (.goos + "/" + .goarch), required: "true"})')
          else
            matrix=$(jq -nc '{include:[{display:"not required", required:"false", runner:"ubuntu-24.04"}]}')
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  packaged_binary_smoke:
    needs: [classify_changes, resolve_platforms]
    # 刻意不加 job 级 if：被 skip 的 matrix job 会让 GitHub 原样显示
    # `${{ matrix.* }}` 占位符；静态名则会被追加整个 matrix tuple。改为始终
    # 运行，非必需时落到便宜的 ubuntu-24.04 并在 step 层跳过全部重活。
    name: Platform smoke · ${{ matrix.display }}
    runs-on: ${{ matrix.required == 'true' && matrix.runner || 'ubuntu-24.04' }}
    permissions:
      contents: read
    env:
      CC: ${{ matrix.cc }}
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve_platforms.outputs.matrix) }}
    steps:
      - name: Mark the change as not requiring platform smoke
        if: matrix.required != 'true'
        shell: bash
        run: printf '%s\n' 'Documentation-only change; platform smoke is not required.'

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: matrix.required == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: matrix.required == 'true'
        with:
          go-version-file: go.mod
      - name: Install the pinned native Rust toolchain
        if: matrix.required == 'true'
        shell: bash
        run: rustup toolchain install '${{ matrix.rust_toolchain }}' --profile minimal --target '${{ matrix.rust_target }}' --no-self-update
      - name: Check vendored Rust sources
        if: matrix.required == 'true'
        shell: bash
        run: sh scripts/test-rust-vendor.sh
      - name: Test the platform installer
        if: matrix.required == 'true'
        shell: bash
        run: go test ./scripts/tests/installers -count=1
      - name: Test platform OAuth callback integration
        if: matrix.required == 'true'
        shell: bash
        run: go test ./internal/cli/commands/pixiv/auth/loginhelper -count=1
      - name: Build and package the platform binary
        if: matrix.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="0.2.0-ci.${GITHUB_RUN_ID}"
          archive=$(sh scripts/build-platform.sh \
            --target '${{ matrix.goos }}/${{ matrix.goarch }}' \
            --rust-target '${{ matrix.rust_target }}' \
            --cc '${{ matrix.cc }}' \
            --version "$version" \
            --output-dir dist \
            --package)
          printf 'PLATFORM_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
      - name: Run native GIF/APNG smoke
        if: matrix.required == 'true'
        shell: bash
        run: |
          set +e
          native_smoke_log="$RUNNER_TEMP/native-ugoira-smoke.log"
          go test ./internal/media/ugoira -run '^TestRustUgoiraEncoderNativeGIFAndAPNG$' -count=1 >"$native_smoke_log" 2>&1
          status=$?
          cat "$native_smoke_log"
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 40 "$native_smoke_log" | tr '\r\n' ' ' | sed 's/%/%25/g')
            printf '::error title=Native GIF/APNG smoke::%s\n' "$message"
            exit "$status"
          fi
      - name: Extract and smoke the packaged binary
        if: matrix.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="0.2.0-ci.${GITHUB_RUN_ID}"
          mkdir -p smoke
          binary='smoke/pixiv'
          if [ '${{ matrix.goos }}' = windows ]; then
            7z x "$PLATFORM_ARCHIVE" -osmoke
            binary='smoke/pixiv.exe'
          else
            tar -xzf "$PLATFORM_ARCHIVE" -C smoke
          fi
          test -f "$binary"
          PIXIV_E2E_BINARY="$(pwd)/$binary" \
          PIXIV_E2E_EXPECTED_VERSION="v${version}" \
          go test ./e2e -run '^TestPixivBinaryPackagedSmoke$' -count=1

  # 分支保护只要求此汇总 job：完整变更必须等全部六个 matrix job 成功，文档改动
  # 则确认 matrix 被有意跳过，避免缺失 matrix check 导致 PR 永远处于 pending。
  platform_smoke_gate:
    name: Platform smoke gate
    needs:
      - classify_changes
      - resolve_platforms
      - packaged_binary_smoke
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the expected matrix outcome
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify_changes.result }}
          PLATFORM_REQUIRED: ${{ needs.classify_changes.outputs.platform_required }}
          RESOLVE_RESULT: ${{ needs.resolve_platforms.result }}
          MATRIX_RESULT: ${{ needs.packaged_binary_smoke.result }}
        run: |
          set -euo pipefail
          # §12.1：失败时必须给出可操作原因，而不是只有退出码。
          if [ "$CLASSIFY_RESULT" != success ]; then
            echo '::error::Platform configuration could not be resolved.'
            exit 1
          fi
          if [ "$RESOLVE_RESULT" != success ]; then
            echo '::error::Platform configuration could not be resolved.'
            exit 1
          fi
          if [ "$MATRIX_RESULT" != success ]; then
            echo '::error::Platform smoke failed on one or more required platforms.'
            exit 1
          fi
          # §12.2：合法跳过必须解释原因。worker 始终运行，非必需时在 step 层
          # 跳过重活，因此这里断言 setup 与 worker 都必须 success。
          if [ "$PLATFORM_REQUIRED" != true ]; then
            printf '%s\n' 'Documentation-only change; platform smoke is not required.'
          fi
