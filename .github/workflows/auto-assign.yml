name: Auto Assign Reviewer

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  add-reviewer:
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'FlanChanXwO'
    runs-on: ubuntu-24.04
    steps:
      - name: Request maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-reviewer FlanChanXwO
